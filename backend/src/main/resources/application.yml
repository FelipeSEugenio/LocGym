spring:
  application:
    name: locgym
  # A aplicação conecta como locgym_app (sem BYPASSRLS); as migrations rodam como dono do schema.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/locgym}
    username: ${DB_APP_USER:locgym_app}
    password: ${DB_APP_PASSWORD:locgym_app}
  flyway:
    user: ${DB_USER:locgym}
    password: ${DB_PASSWORD:locgym}
    placeholders:
      app_usuario: ${DB_APP_USER:locgym_app}
      app_senha: ${DB_APP_PASSWORD:locgym_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Com o Kafka fora, o envio desiste em ~5 s (padrões: 60 s bloqueado em send() e 120 s de entrega),
        # para o relay não segurar transação, conexão e lock por muito tempo.
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2   # o relay do outbox não pode monopolizar os agendamentos

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness: só o estado do próprio processo.
        liveness:
          include: livenessState
        # Readiness: banco de dados; o Kafka fica de fora (o outbox retém os eventos).
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs

locgym:
  outbox:
    relay-habilitado: true
    intervalo-ms: 1000
    lote: 100
    # Maior que delivery.timeout.ms: quando o relay desiste, o produtor também já desistiu
    # (evita reenvio de algo ainda pendente no buffer).
    timeout-envio-ms: 6000
