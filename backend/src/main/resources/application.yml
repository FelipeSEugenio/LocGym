spring:
  application:
    name: locgym
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/locgym}
    username: ${DB_USER:locgym}
    password: ${DB_PASSWORD:locgym}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness: só o estado do próprio processo.
        liveness:
          include: livenessState
        # Readiness: banco de dados; o Kafka fica de fora (o outbox retém os eventos).
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs
