server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno do Docker, re-resolvido a cada 10s: o proxy sobrevive a reinícios do backend
    # e o nginx sobe mesmo que o backend ainda não exista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API e health check do backend (o navegador fala só com esta origem).
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass $backend;
    }

    # Assets com hash no nome: cache longo.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rotas do Angular caem no index.html, que nunca é cacheado.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
